    <!-- Non-production host guard: prevent Google/Bing/etc from indexing preview / lovable.app / any host ≠ garageflow.pt.
         Runs synchronously before body parse so crawlers that execute JS see the noindex before rendering. -->
    <script>
      (function () {
        try {
          var host = location.hostname;
          var isProd = host === "garageflow.pt" || host === "www.garageflow.pt";
          if (isProd) return;
          var m = document.createElement("meta");
          m.name = "robots";
          m.content = "noindex, nofollow, noarchive, nosnippet";
          document.head.appendChild(m);
          var gm = document.createElement("meta");
          gm.name = "googlebot";
          gm.content = "noindex, nofollow";
          document.head.appendChild(gm);
          // Rewrite canonical + og:url to the production equivalent so any accidental crawl consolidates on garageflow.pt.
          var prodUrl = "https://garageflow.pt" + location.pathname + location.search;
          document.querySelectorAll('link[rel="canonical"], meta[property="og:url"]').forEach(function (el) {
            if (el.tagName === "LINK") el.setAttribute("href", prodUrl);
            else el.setAttribute("content", prodUrl);
          });
        } catch (_) { /* noop — never break the page */ }
      })();
    </script>

    <!-- Critical CSS do arranque: pinta o fundo da app e o splash ANTES de qualquer CSS/JS
         do bundle. Elimina o flash do HTML pré-renderizado (SSG/SEO), o FOUC e o ecrã branco. -->
    <style>
      html, body { margin: 0; padding: 0; background: #f5f6f8; }
      html.dark, html.dark body { background: #0d1116; }
      #root { min-height: 100vh; }
      #gf-boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f5f6f8; color: #1c1f24;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        transition: opacity .18s ease-out;
      }
      html.dark #gf-boot { background: #0d1116; color: #f5f5f4; }
      #gf-boot[data-hiding="1"] { opacity: 0; pointer-events: none; }
      #gf-boot .gf-logo { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: #e8930c; }
      #gf-boot .gf-spinner {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid rgba(232, 147, 12, .22); border-top-color: #e8930c;
        animation: gf-spin .7s linear infinite;
      }
      @keyframes gf-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #gf-boot .gf-spinner { animation-duration: 2s; } }
    </style>
    <noscript><style>#gf-boot { display: none !important; }</style></noscript>
    <!-- Tema aplicado antes do primeiro paint: evita o flash claro→escuro no arranque
         (mesma fonte de verdade do ThemeProvider: localStorage `garageflow_theme`). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("garageflow_theme");
          var dark = t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"><div id="gf-boot" aria-hidden="true"><div class="gf-logo">GarageFlow</div><div class="gf-spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
