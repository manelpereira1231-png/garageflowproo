    <script type="application/ld+json">
    {

        {
          "@type": "Question",
          "name": "O que é o GarageFlow Pro?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O GarageFlow Pro é um software de gestão para oficinas automóvel que permite criar orçamentos, gerir ordens de serviço, faturação, clientes e veículos numa única plataforma online."
          }
        },
        {
          "@type": "Question",
          "name": "O GarageFlow funciona em Portugal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o GarageFlow foi desenhado para oficinas em Portugal com suporte a IVA português, terminologia PT-PT e integração com processos fiscais locais."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto custa o software de gestão de oficinas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O GarageFlow oferece um plano gratuito com funcionalidades básicas. O plano Pro custa 49€/mês e o plano Garage 99€/mês, ambos com teste grátis de 30 dias."
          }
        },
        {
          "@type": "Question",
          "name": "Posso usar o GarageFlow no telemóvel?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o GarageFlow é uma aplicação web progressiva (PWA) que funciona em qualquer browser, incluindo telemóvel e tablet, sem necessidade de instalar uma app."
          }
        },
        {
          "@type": "Question",
          "name": "Como faço orçamentos para clientes?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No GarageFlow pode criar orçamentos profissionais com peças, mão de obra e IVA em poucos cliques. O cliente pode aprovar online com assinatura digital."
          }
        },
        {
          "@type": "Question",
          "name": "O GarageFlow gere stock de peças?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o sistema inclui gestão de stock com alertas de stock mínimo, movimentos automáticos ao fechar ordens de serviço e integração com fornecedores."
          }
        },
        {
          "@type": "Question",
          "name": "É possível gerir várias oficinas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o plano Garage permite gerir até 5 oficinas com utilizadores ilimitados, relatórios avançados e automações completas."
          }
        },
        {
          "@type": "Question",
          "name": "Como funciona a faturação no GarageFlow?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O GarageFlow gera faturas profissionais a partir de ordens de serviço ou orçamentos aprovados, com cálculo automático de IVA e possibilidade de pagamento online."
          }
        }
